{% extends "base.html" %}
{% block title %}Login - SAVIX AI{% endblock %}
{% block auth_content %}
<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-brand"><i class="bi bi-wallet2"></i> SAVIX <span class="accent">AI</span></div>
    <p class="auth-tagline">Smart. Simple. AI-Powered.</p>

    <h5 class="mb-3">Welcome back</h5>

    <form method="POST">
      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" name="email" class="form-control" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" name="password" class="form-control" required>
      </div>
      <button type="submit" class="btn btn-primary w-100">Login</button>
    </form>

    {% if google_enabled %}
    <div class="or-divider"><span>or</span></div>
    <a href="{{ url_for('auth.google_login') }}" class="btn btn-outline-secondary w-100">
      <i class="bi bi-google"></i> Continue with Google
    </a>
    {% endif %}

    <p class="text-center mt-3 mb-0">
      Don't have an account? <a href="{{ url_for('auth.register') }}">Sign up</a>
    </p>
  </div>
</div>
{% endblock %}
