{% extends "base.html" %}
{% block title %}Too Many Requests - SAVIX AI{% endblock %}
{% block content %}
<div class="d-flex flex-column align-items-center justify-content-center" style="min-height:60vh;">
  <div class="text-center">
    <i class="bi bi-shield-exclamation" style="font-size:4rem;color:var(--accent);"></i>
    <h2 class="mt-3 fw-bold">Too Many Requests</h2>
    <p class="text-muted">You have made too many requests in a short period of time.<br>Please wait a moment before trying again.</p>
    <a href="{{ url_for('auth.login') }}" class="btn btn-primary mt-2"><i class="bi bi-arrow-left"></i> Back to Login</a>
  </div>
</div>
{% endblock %}
