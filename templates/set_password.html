{% extends "base.html" %}
{% block title %}Set Password - SAVIX AI{% endblock %}
{% block auth_content %}
<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-brand"><i class="bi bi-wallet2"></i> SAVIX <span class="accent">AI</span></div>
    <h5 class="mt-3 mb-1">Welcome to SAVIX AI</h5>
    <p class="text-muted">Create a password so you can also log in with email + password next time.</p>

    <form method="POST">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mb-3">
        <label class="form-label">New Password</label>
        <input type="password" name="password" class="form-control" required minlength="6">
      </div>
      <div class="mb-3">
        <label class="form-label">Confirm Password</label>
        <input type="password" name="confirm_password" class="form-control" required minlength="6">
      </div>
      <button type="submit" class="btn btn-primary w-100">Save Password</button>
    </form>
  </div>
</div>
{% endblock %}
