{% extends "base.html" %}
{% block title %}Budget - SAVIX AI{% endblock %}
{% block content %}
<div class="page-header"><h4 class="mb-0">Budget Management</h4></div>

<div class="row g-3">
  <div class="col-lg-5">
    <div class="panel">
      <h6 class="mb-2">Set Monthly Budget</h6>
      <form method="POST" action="{{ url_for('budget.save_budget') }}">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="mb-3">
          <label class="form-label">Monthly Budget Amount (₹)</label>
          <input type="number" step="0.01" name="amount" class="form-control" value="{{ budget_amount }}" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">Save Budget</button>
      </form>
    </div>
  </div>

  <div class="col-lg-7">
    <div class="panel">
      <h6 class="mb-2">This Month</h6>
      <div class="d-flex justify-content-between mb-1">
        <span>Spent: ₹{{ month_spent }}</span>
        <span>Remaining: ₹{{ remaining }}</span>
      </div>
      <div class="progress mb-2" style="height: 14px;">
        <div class="progress-bar bg-{{ 'danger' if status in ['exceeded','critical'] else ('warning' if status == 'warning' else 'success') }}"
             role="progressbar" style="width: {{ pct }}%">{{ pct }}%</div>
      </div>
      <div class="alert alert-{{ 'danger' if status in ['exceeded','critical'] else ('warning' if status == 'warning' else 'success') }} mb-0">
        {{ message }}
      </div>
    </div>
  </div>
</div>
{% endblock %}
